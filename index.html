<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charles's Betting Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .viz-root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --good:           #0ca30c;
    --good-text:      #006300;
    --critical:       #d03b3b;
    --warning:        #fab219;
    --ghost:          rgba(11,11,11,0.045);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --good:           #0ca30c;
      --good-text:      #0ca30c;
      --critical:       #d03b3b;
      --warning:        #fab219;
      --ghost:          rgba(255,255,255,0.06);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --good:           #0ca30c;
    --good-text:      #0ca30c;
    --critical:       #d03b3b;
    --warning:        #fab219;
    --ghost:          rgba(255,255,255,0.06);
  }

  body { background: var(--page); }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 28px clamp(16px, 4vw, 48px) 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  header .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

  /* ---- Filter row ---- */
  .filters {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin: 26px 0 6px; padding-bottom: 14px;
    border-bottom: 1px solid var(--gridline);
  }
  .seg { display: inline-flex; gap: 2px; }
  .seg button {
    font: inherit; font-size: 13px; color: var(--text-muted);
    background: none; border: none; border-radius: 6px;
    padding: 5px 11px; cursor: pointer;
  }
  .seg button:hover { background: var(--ghost); color: var(--text-secondary); }
  .seg button[aria-pressed="true"] {
    background: var(--ghost); color: var(--text-primary); font-weight: 600;
  }
  .filters select {
    font: inherit; font-size: 13px; color: var(--text-secondary);
    background: transparent; border: none;
    border-radius: 6px; padding: 5px 4px; cursor: pointer;
  }
  .filters select:hover { background: var(--ghost); }

  /* ---- Stat strip ---- */
  .tiles {
    display: flex; flex-wrap: wrap; row-gap: 20px;
    margin: 26px 0 10px; align-items: flex-end;
  }
  .tile { padding: 0 26px; border-left: 1px solid var(--gridline); }
  .tile:first-child { border-left: none; padding-left: 0; }
  .tile .label { font-size: 12px; color: var(--text-muted); }
  .tile .value {
    font-size: 21px; font-weight: 600; margin-top: 5px; letter-spacing: -0.01em;
  }
  .tile.hero { padding-right: 34px; }
  .tile.hero .value { font-size: 40px; letter-spacing: -0.02em; line-height: 1.05; }
  .tile .note { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .value.pos { color: var(--good-text); }
  .value.neg { color: var(--critical); }

  /* ---- Sections ---- */
  .card { margin-top: 40px; }
  .card h2 {
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  .card .card-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
  .chart-box { position: relative; margin-top: 10px; }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .empty {
    padding: 44px 12px; text-align: center;
    color: var(--text-muted); font-size: 13.5px;
  }

  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12); z-index: 5;
    min-width: 130px;
  }
  .tooltip .t-date { color: var(--text-muted); font-size: 11.5px; margin-bottom: 4px; }
  .tooltip .t-row { display: flex; align-items: baseline; gap: 7px; }
  .tooltip .t-key {
    width: 12px; height: 0; border-top: 2px solid var(--series-1);
    align-self: center; flex: none;
  }
  .tooltip .t-val { font-weight: 650; color: var(--text-primary); }
  .tooltip .t-name { color: var(--text-secondary); }
  .tooltip .t-pick { margin-top: 3px; color: var(--text-secondary); font-size: 11.5px; max-width: 200px; }

  /* ---- Table ---- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); padding: 8px 10px;
    border-bottom: 1px solid var(--gridline); white-space: nowrap;
  }
  tbody td {
    padding: 11px 10px; border-bottom: 1px solid var(--gridline);
    color: var(--text-primary); vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--ghost); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.muted { color: var(--text-muted); }
  .pick-cell { max-width: 260px; }
  .pick-type { color: var(--text-muted); font-size: 11.5px; margin-top: 1px; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .chip.win  { color: var(--good-text); }
  .chip.loss { color: var(--critical); }
  .chip.push { color: var(--text-secondary); }
  .chip.pending { color: var(--text-muted); font-weight: 500; }
  .pl-pos { color: var(--good-text); font-weight: 600; }
  .pl-neg { color: var(--critical); font-weight: 600; }

  .table-scroll { overflow-x: auto; }
  footer { margin-top: 14px; color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
  <header>
    <h1>Charles's Betting Tracker</h1>
    <div class="sub" id="subline">Tell Claude your picks and results — this page updates with every bet.</div>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <div class="seg" id="rangeSeg">
      <button data-range="all" aria-pressed="true">All time</button>
      <button data-range="7" aria-pressed="false">Last 7 days</button>
      <button data-range="30" aria-pressed="false">Last 30 days</button>
    </div>
    <select id="sportSel" aria-label="Sport filter"><option value="all">All sports</option></select>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>Cumulative profit</h2>
    <div class="card-sub">Settled bets only, in bet order</div>
    <div class="chart-box" id="chartBox"></div>
  </div>

  <div class="card">
    <h2>Bet log</h2>
    <div class="card-sub" id="logCount"></div>
    <div class="table-scroll" style="margin-top:10px;">
      <table id="logTable" aria-label="Bet log">
        <thead>
          <tr>
            <th>Date</th><th>Sport</th><th>Pick</th>
            <th class="num">Odds</th><th class="num">Stake</th>
            <th>Result</th><th class="num">P/L</th><th class="num">Running</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <footer>American odds · pushes return the stake · updated by Claude as results come in</footer>
</div>
</div>

<script>
/* =======================================================================
   BET DATA — Claude edits this array as Charles reports picks & results.
   result: "win" | "loss" | "push" | "pending"
   odds: American (e.g. -110, +150). stake in dollars.
   ======================================================================= */
const BETS = [
  { date: "2026-07-28", sport: "MLB", pick: "Detroit Tigers ML", type: "Moneyline", odds: -149, stake: 500, result: "pending", book: "" },
  { date: "2026-07-28", sport: "MLB", pick: "Phillies/Marlins o7.5", type: "Total", odds: -134, stake: 500, result: "pending", book: "" },
  { date: "2026-07-28", sport: "MLB", pick: "Padres ML vs Rockies", type: "Moneyline", odds: -223, stake: 500, result: "pending", book: "" },
  { date: "2026-07-28", sport: "MLB", pick: "Padres/Rockies o7.5", type: "Total", odds: -143, stake: 500, result: "pending", book: "" },
];

/* ---------------- calculations ---------------- */
function profitIfWin(odds, stake) {
  return odds > 0 ? stake * (odds / 100) : stake * (100 / Math.abs(odds));
}
function betPL(b) {
  if (b.result === "win") return profitIfWin(b.odds, b.stake);
  if (b.result === "loss") return -b.stake;
  return 0; // push or pending
}
function fmtMoney(v, signed) {
  const sign = v < 0 ? "-" : (signed && v > 0 ? "+" : "");
  const abs = Math.abs(v);
  const s = abs >= 1000 ? abs.toLocaleString("en-US", {maximumFractionDigits: 0})
                        : abs.toLocaleString("en-US", {minimumFractionDigits: abs % 1 ? 2 : 0, maximumFractionDigits: 2});
  return sign + "$" + s;
}
function fmtOdds(o) { return (o > 0 ? "+" : "") + o; }
function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

/* ---------------- state & filtering ---------------- */
let range = "all", sport = "all";
const latestDate = () => BETS.length ? BETS.map(b => b.date).sort().pop() : null;

function filtered() {
  let rows = BETS.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (sport !== "all") rows = rows.filter(b => b.sport === sport);
  if (range !== "all" && rows.length) {
    const end = latestDate();
    const [y, m, d] = end.split("-").map(Number);
    const cut = new Date(y, m - 1, d - (Number(range) - 1));
    rows = rows.filter(b => {
      const [by, bm, bd] = b.date.split("-").map(Number);
      return new Date(by, bm - 1, bd) >= cut;
    });
  }
  return rows;
}

/* ---------------- render: tiles ---------------- */
function renderTiles(rows) {
  const settled = rows.filter(b => b.result !== "pending");
  const wins = settled.filter(b => b.result === "win").length;
  const losses = settled.filter(b => b.result === "loss").length;
  const pushes = settled.filter(b => b.result === "push").length;
  const pending = rows.length - settled.length;
  const net = settled.reduce((s, b) => s + betPL(b), 0);
  const staked = settled.reduce((s, b) => s + b.stake, 0);
  const decided = wins + losses;
  const winRate = decided ? (wins / decided * 100) : null;
  const roi = staked ? (net / staked * 100) : null;

  const el = document.getElementById("tiles");
  el.textContent = "";
  const pendingRisk = rows.filter(b => b.result === "pending").reduce((s, b) => s + b.stake, 0);
  const tiles = [
    { label: "Net profit", value: fmtMoney(net, true), cls: net > 0 ? "pos" : net < 0 ? "neg" : "", hero: true,
      note: settled.length ? settled.length + " settled bet" + (settled.length === 1 ? "" : "s") : "no settled bets yet" },
    { label: "Record", value: wins + "–" + losses + (pushes ? "–" + pushes : ""), note: pushes ? "W–L–Push" : "W–L" },
    { label: "Win rate", value: winRate === null ? "—" : winRate.toFixed(1) + "%", note: "decided bets" },
    { label: "ROI", value: roi === null ? "—" : (roi > 0 ? "+" : "") + roi.toFixed(1) + "%",
      cls: roi > 0 ? "pos" : roi < 0 ? "neg" : "", note: "on " + fmtMoney(staked) + " staked" },
    { label: "Pending", value: String(pending), note: pending ? fmtMoney(pendingRisk) + " at stake" : "none open" },
  ];
  for (const t of tiles) {
    const d = document.createElement("div");
    d.className = "tile" + (t.hero ? " hero" : "");
    const l = document.createElement("div"); l.className = "label"; l.textContent = t.label;
    const v = document.createElement("div"); v.className = "value" + (t.cls ? " " + t.cls : ""); v.textContent = t.value;
    d.append(l, v);
    if (t.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = t.note; d.append(n); }
    el.append(d);
  }
}

/* ---------------- render: chart ---------------- */
function renderChart(rows) {
  const box = document.getElementById("chartBox");
  box.textContent = "";
  const settled = rows.filter(b => b.result !== "pending");
  if (settled.length < 1) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = BETS.length ? "No settled bets in this view yet." : "No bets logged yet — give Claude your first picks to start the line.";
    box.append(d);
    return;
  }

  // cumulative points, with a zero start
  let cum = 0;
  const pts = [{ x: 0, v: 0, label: "Start", pick: "" }];
  settled.forEach((b, i) => {
    cum += betPL(b);
    pts.push({ x: i + 1, v: cum, label: fmtDate(b.date), pick: b.pick, pl: betPL(b) });
  });

  const W = 960, H = 300, m = { t: 16, r: 20, b: 28, l: 56 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vMin = Math.min(0, ...pts.map(p => p.v)), vMax = Math.max(0, ...pts.map(p => p.v));
  const pad = Math.max((vMax - vMin) * 0.1, 1);
  const lo = vMin - (vMin < 0 ? pad : 0), hi = vMax + (vMax > 0 ? pad : pad);
  const xs = x => m.l + (pts.length === 1 ? 0 : x / (pts.length - 1) * iw);
  const ys = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Cumulative profit line chart");

  // gridlines: clean steps
  const span = hi - lo;
  const rawStep = span / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => span / s <= 5) || 10 * mag;
  const g0 = Math.ceil(lo / step) * step;
  for (let gv = g0; gv <= hi + 1e-9; gv += step) {
    const y = ys(gv);
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", m.l); line.setAttribute("x2", W - m.r);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    line.setAttribute("stroke", gv === 0 ? "var(--baseline)" : "var(--gridline)");
    line.setAttribute("stroke-width", "1");
    svg.append(line);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", m.l - 8); t.setAttribute("y", y + 4);
    t.setAttribute("text-anchor", "end");
    t.setAttribute("font-size", "11"); t.setAttribute("fill", "var(--text-muted)");
    t.setAttribute("font-variant-numeric", "tabular-nums");
    t.textContent = fmtMoney(gv, true);
    svg.append(t);
  }

  // area wash + line
  const path = pts.map((p, i) => (i ? "L" : "M") + xs(p.x).toFixed(1) + " " + ys(p.v).toFixed(1)).join(" ");
  const area = document.createElementNS(NS, "path");
  area.setAttribute("d", path + " L" + xs(pts[pts.length - 1].x).toFixed(1) + " " + ys(0).toFixed(1) + " L" + xs(0).toFixed(1) + " " + ys(0).toFixed(1) + " Z");
  area.setAttribute("fill", "var(--series-1)"); area.setAttribute("opacity", "0.1");
  svg.append(area);
  const lineEl = document.createElementNS(NS, "path");
  lineEl.setAttribute("d", path);
  lineEl.setAttribute("fill", "none");
  lineEl.setAttribute("stroke", "var(--series-1)");
  lineEl.setAttribute("stroke-width", "2");
  lineEl.setAttribute("stroke-linejoin", "round");
  lineEl.setAttribute("stroke-linecap", "round");
  svg.append(lineEl);

  // end marker with surface ring + end label
  const last = pts[pts.length - 1];
  const ring = document.createElementNS(NS, "circle");
  ring.setAttribute("cx", xs(last.x)); ring.setAttribute("cy", ys(last.v));
  ring.setAttribute("r", "6"); ring.setAttribute("fill", "var(--surface-1)");
  svg.append(ring);
  const dot = document.createElementNS(NS, "circle");
  dot.setAttribute("cx", xs(last.x)); dot.setAttribute("cy", ys(last.v));
  dot.setAttribute("r", "4"); dot.setAttribute("fill", "var(--series-1)");
  svg.append(dot);
  const endT = document.createElementNS(NS, "text");
  const endX = xs(last.x), flip = endX > W - m.r - 70;
  endT.setAttribute("x", flip ? endX - 10 : endX + 10);
  endT.setAttribute("y", ys(last.v) - 10);
  endT.setAttribute("text-anchor", flip ? "end" : "start");
  endT.setAttribute("font-size", "12"); endT.setAttribute("font-weight", "650");
  endT.setAttribute("fill", "var(--text-primary)");
  endT.textContent = fmtMoney(last.v, true);
  svg.append(endT);

  // crosshair + tooltip layer
  const cross = document.createElementNS(NS, "line");
  cross.setAttribute("y1", m.t); cross.setAttribute("y2", H - m.b);
  cross.setAttribute("stroke", "var(--baseline)"); cross.setAttribute("stroke-width", "1");
  cross.setAttribute("visibility", "hidden");
  svg.append(cross);
  const hoverRing = document.createElementNS(NS, "circle");
  hoverRing.setAttribute("r", "6"); hoverRing.setAttribute("fill", "var(--surface-1)");
  hoverRing.setAttribute("visibility", "hidden");
  const hoverDot = document.createElementNS(NS, "circle");
  hoverDot.setAttribute("r", "4"); hoverDot.setAttribute("fill", "var(--series-1)");
  hoverDot.setAttribute("visibility", "hidden");
  svg.append(hoverRing, hoverDot);

  const tip = document.createElement("div");
  tip.className = "tooltip";
  box.append(svg, tip);

  function showAt(clientX) {
    const rect = svg.getBoundingClientRect();
    const px = (clientX - rect.left) / rect.width * W;
    let best = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(xs(p.x) - px); if (d < bd) { bd = d; best = i; } });
    const p = pts[best];
    cross.setAttribute("x1", xs(p.x)); cross.setAttribute("x2", xs(p.x));
    cross.setAttribute("visibility", "visible");
    hoverRing.setAttribute("cx", xs(p.x)); hoverRing.setAttribute("cy", ys(p.v));
    hoverDot.setAttribute("cx", xs(p.x)); hoverDot.setAttribute("cy", ys(p.v));
    hoverRing.setAttribute("visibility", "visible");
    hoverDot.setAttribute("visibility", "visible");

    tip.textContent = "";
    const d1 = document.createElement("div"); d1.className = "t-date";
    d1.textContent = p.label + (p.x > 0 ? " · bet " + p.x : "");
    const r1 = document.createElement("div"); r1.className = "t-row";
    const k = document.createElement("span"); k.className = "t-key";
    const v = document.createElement("span"); v.className = "t-val"; v.textContent = fmtMoney(p.v, true);
    const n = document.createElement("span"); n.className = "t-name"; n.textContent = "cumulative";
    r1.append(k, v, n);
    tip.append(d1, r1);
    if (p.pick) {
      const pk = document.createElement("div"); pk.className = "t-pick";
      pk.textContent = p.pick + " (" + fmtMoney(p.pl, true) + ")";
      tip.append(pk);
    }
    tip.style.display = "block";
    const bw = box.clientWidth, tw = tip.offsetWidth;
    let left = xs(p.x) / W * rect.width + 14;
    if (left + tw > bw - 4) left = xs(p.x) / W * rect.width - tw - 14;
    tip.style.left = Math.max(4, left) + "px";
    tip.style.top = Math.max(0, ys(p.v) / H * rect.height - 20) + "px";
  }
  function hide() {
    cross.setAttribute("visibility", "hidden");
    hoverRing.setAttribute("visibility", "hidden");
    hoverDot.setAttribute("visibility", "hidden");
    tip.style.display = "none";
  }
  svg.addEventListener("pointermove", e => showAt(e.clientX));
  svg.addEventListener("pointerleave", hide);
}

/* ---------------- render: table ---------------- */
const RESULT_CHIP = {
  win:     { icon: "✓", text: "Won",     cls: "win" },
  loss:    { icon: "✗", text: "Lost",    cls: "loss" },
  push:    { icon: "▬", text: "Push",    cls: "push" },
  pending: { icon: "◷", text: "Pending", cls: "pending" },
};
function renderTable(rows) {
  const tbody = document.querySelector("#logTable tbody");
  tbody.textContent = "";
  const count = document.getElementById("logCount");
  count.textContent = rows.length ? rows.length + " bet" + (rows.length === 1 ? "" : "s") + " in this view" : "";

  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 8; td.className = "muted";
    td.style.textAlign = "center"; td.style.padding = "28px 10px";
    td.textContent = "No bets yet. Tell Claude a pick — e.g. “$50 on Cubs ML at -120” — and it appears here.";
    tr.append(td); tbody.append(tr);
    return;
  }

  let running = 0;
  for (const b of rows) {
    const pl = b.result === "pending" ? null : betPL(b);
    if (pl !== null) running += pl;
    const tr = document.createElement("tr");

    const cells = [];
    const tdDate = document.createElement("td"); tdDate.className = "muted"; tdDate.textContent = fmtDate(b.date); cells.push(tdDate);
    const tdSport = document.createElement("td"); tdSport.textContent = b.sport; cells.push(tdSport);
    const tdPick = document.createElement("td"); tdPick.className = "pick-cell";
    const pMain = document.createElement("div"); pMain.textContent = b.pick;
    tdPick.append(pMain);
    if (b.type || b.book) {
      const pType = document.createElement("div"); pType.className = "pick-type";
      pType.textContent = [b.type, b.book].filter(Boolean).join(" · ");
      tdPick.append(pType);
    }
    cells.push(tdPick);
    const tdOdds = document.createElement("td"); tdOdds.className = "num"; tdOdds.textContent = fmtOdds(b.odds); cells.push(tdOdds);
    const tdStake = document.createElement("td"); tdStake.className = "num"; tdStake.textContent = fmtMoney(b.stake); cells.push(tdStake);

    const tdRes = document.createElement("td");
    const c = RESULT_CHIP[b.result] || RESULT_CHIP.pending;
    const chip = document.createElement("span"); chip.className = "chip " + c.cls;
    const ic = document.createElement("span"); ic.setAttribute("aria-hidden", "true"); ic.textContent = c.icon;
    chip.append(ic, document.createTextNode(c.text));
    tdRes.append(chip); cells.push(tdRes);

    const tdPL = document.createElement("td"); tdPL.className = "num";
    if (pl === null) { tdPL.textContent = "—"; tdPL.classList.add("muted"); }
    else { tdPL.textContent = fmtMoney(pl, true); tdPL.classList.add(pl > 0 ? "pl-pos" : pl < 0 ? "pl-neg" : "muted"); }
    cells.push(tdPL);

    const tdRun = document.createElement("td"); tdRun.className = "num";
    if (pl === null) { tdRun.textContent = ""; }
    else { tdRun.textContent = fmtMoney(running, true); tdRun.classList.add("muted"); }
    cells.push(tdRun);

    tr.append(...cells);
    tbody.append(tr);
  }
}

/* ---------------- wiring ---------------- */
function renderAll() {
  const rows = filtered();
  renderTiles(rows);
  renderChart(rows);
  renderTable(rows);
}
document.getElementById("rangeSeg").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  range = btn.dataset.range;
  document.querySelectorAll("#rangeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  renderAll();
});
const sportSel = document.getElementById("sportSel");
(function fillSports() {
  const sports = [...new Set(BETS.map(b => b.sport))].sort();
  for (const s of sports) {
    const o = document.createElement("option"); o.value = s; o.textContent = s;
    sportSel.append(o);
  }
})();
sportSel.addEventListener("change", () => { sport = sportSel.value; renderAll(); });
window.addEventListener("resize", () => renderChart(filtered()));
renderAll();
</script>
